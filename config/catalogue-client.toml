[catalogue]
nom = "Catalogue ARCenal Client"
version = "0.1.0"
source_officielle = "https://app.yunohost.org/default/v3/apps.json"

[canaux.stable]
applications_yunohost = ["nextcloud", "dolibarr", "vaultwarden"]

[canaux.preview]
applications_yunohost = ["nextcloud", "dolibarr", "vaultwarden", "outline"]

[canaux.development]
applications_yunohost = ["nextcloud", "dolibarr", "vaultwarden", "outline", "vikunja"]

[[applications.arcenal]]
id = "arcenal-systeme"
nom = "ARCenal Système"
description_fr = "Socle de catalogue contrôlé et d'expérience ARCenal pour YunoHost."
depot = "https://github.com/arcenal-coder/arcenal-systeme_ynh"
branche = "main"
revision = "3ac7ddab0686390a9e094f532c16230ea63822fd"
canaux = ["stable", "preview", "development"]
version = "0.3.2~ynh1"
minimum_yunohost = ">= 12.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disque = "1M"
ram_build = "10M"
ram_runtime = "10M"

[[applications.arcenal]]
id = "arcenal-portail"
nom = "ARCenal Portail"
description_fr = "Portail d'accueil ARCenal pour vos services sélectionnés."
depot = "https://github.com/arcenal-coder/arcenal-portail_ynh"
branche = "main"
revision = "291a5c151a3dd7c46435ecea33af04f5b4c0d5c7"
canaux = ["stable", "preview", "development"]
version = "0.2.0~ynh1"
minimum_yunohost = ">= 12.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disque = "2M"
ram_build = "10M"
ram_runtime = "10M"

[[applications.arcenal]]
id = "arcenalportail"
nom = "ARCenal Portail"
description_fr = "Portail équipier QSSE relié au module Dolibarr ARCenal QSSE."
depot = "https://github.com/arcenal-coder/arcenalportail_ynh"
branche = "main"
canaux = ["preview", "development"]
version = "0.4.4~beta1+ynh1"
minimum_yunohost = ">= 12.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disque = "10M"
ram_build = "50M"
ram_runtime = "50M"
